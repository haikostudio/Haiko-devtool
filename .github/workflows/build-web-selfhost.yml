name: Build Web (self-host)

# Builds the Expo web app as static files and uploads them as an artifact.
# The self-hosted VPS downloads this artifact and serves it via Caddy at
# app.haikostudio.cloud. No Cloudflare / paseo.sh infra involved.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/github-repo-picker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Full history so generate-changelog-data.mjs can read the commit log for
        # the changelog page's Commits tab (default shallow checkout gives 1 commit).
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (static export)
        run: npm run build:web --workspace=@getpaseo/app

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/app/dist
          if-no-files-found: error
          retention-days: 14
