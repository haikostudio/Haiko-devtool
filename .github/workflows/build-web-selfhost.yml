name: Build Web (self-host)

# Builds the Expo web app as static files and uploads them as an artifact.
# The self-hosted VPS downloads this artifact and serves it via Caddy at
# app.haikostudio.cloud. No Cloudflare / paseo.sh infra involved.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/github-repo-picker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Full history so generate-changelog-data.mjs can read the commit log for
        # the changelog page's Commits + Unreleased sections (default shallow
        # checkout gives 1 commit).
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # generate-changelog-data.mjs runs `git log --all` so the changelog reflects
      # work on ANY branch, not just the triggering one. checkout only brings down
      # the triggering ref, so fetch every remote head here to make them visible.
      - name: Fetch all branches
        run: git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (static export)
        run: npm run build:web --workspace=@getpaseo/app
        env:
          # Baked into the bundle so the running app knows which build it is.
          # The app polls /version.json (written below) and shows a "reload"
          # banner when the live build differs from this baked value.
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Write version marker
        run: printf '{"sha":"%s"}\n' "${{ github.sha }}" > packages/app/dist/version.json

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/app/dist
          if-no-files-found: error
          retention-days: 14
